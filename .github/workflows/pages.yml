name: Publish visual demo

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "demo/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Assemble static preview
        run: |
          mkdir -p _site/assets _site/demo
          cp index.html _site/index.html
          cp -R assets/css assets/fonts assets/images assets/js _site/assets/
          cp demo/index.html _site/demo/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

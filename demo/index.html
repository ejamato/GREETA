<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#080d14">
  <meta name="description" content="A visual preview of GREETA, a pixel-inspired Linux login experience.">
  <title>GREETA | Visual Preview</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #080d14;
      color: #e8f1ff;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      padding: .8rem 1.2rem;
      border-bottom: 2px solid #36cfff;
      background: #101a2a;
    }

    .brand {
      color: #36cfff;
      font-weight: 800;
      letter-spacing: .14em;
      white-space: nowrap;
    }

    .notice {
      margin: 0;
      color: #d7e3f6;
      font-size: .85rem;
      text-align: right;
    }

    a { color: #ffd18a; }

    main { min-height: 0; }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 580px;
      border: 0;
      background: #080d14;
    }

    @media (max-width: 640px) {
      header {
        align-items: flex-start;
        flex-direction: column;
        gap: .35rem;
      }

      .notice { text-align: left; }
      iframe { min-height: 700px; }
    }
  </style>
</head>
<body>
  <header>
    <span class="brand">▣ GREETA / EJA</span>
    <p class="notice">
      VISUAL PREVIEW — Password entry and power actions are disabled.
      <a href="../">Project home</a>
    </p>
  </header>
  <main>
    <iframe
      id="preview"
      title="GREETA visual preview; authentication and power actions are disabled"
      src="../index.html"
      loading="eager"
      referrerpolicy="no-referrer"
    ></iframe>
  </main>
  <script>
    const previewFrame = document.getElementById("preview");
    previewFrame.addEventListener("load", () => {
      const previewDocument = previewFrame.contentDocument;
      if (!previewDocument) return;

      for (const selector of [
        "#password",
        "#login-button",
        "[data-system-action]",
      ]) {
        previewDocument.querySelectorAll(selector).forEach((control) => {
          control.disabled = true;
        });
      }
    });
  </script>
</body>
</html>
